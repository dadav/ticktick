services:
  ticktick:
    build: .
    container_name: ticktick
    ports:
      - "${TICKTICK_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Timestamps are naive local time, so the container needs the user's zone
      - TZ=${TZ:-Europe/Berlin}
      - TICKTICK_DB_PATH=/app/data/ticktick.db
      - TICKTICK_WEEKLY_HOURS=${TICKTICK_WEEKLY_HOURS:-41}
      - TICKTICK_MAX_DAILY_HOURS=${TICKTICK_MAX_DAILY_HOURS:-10}
      - TICKTICK_LUNCH_THRESHOLD=${TICKTICK_LUNCH_THRESHOLD:-6}
      - TICKTICK_LUNCH_DURATION=${TICKTICK_LUNCH_DURATION:-30}
      - TICKTICK_GOTIFY_URL=${TICKTICK_GOTIFY_URL:-}
      - TICKTICK_GOTIFY_TOKEN=${TICKTICK_GOTIFY_TOKEN:-}
      - TICKTICK_GOTIFY_PRIORITY=${TICKTICK_GOTIFY_PRIORITY:-5}
      - TICKTICK_REMINDER_TIME=${TICKTICK_REMINDER_TIME:-09:00}
      - TICKTICK_REMINDER_CUTOFF=${TICKTICK_REMINDER_CUTOFF:-12:00}
      - TICKTICK_REMINDER_WEEKDAYS=${TICKTICK_REMINDER_WEEKDAYS:-mon,tue,wed,thu,fri}
      - TICKTICK_HOLIDAY_COUNTRY=${TICKTICK_HOLIDAY_COUNTRY:-DE}
      - TICKTICK_HOLIDAY_SUBDIV=${TICKTICK_HOLIDAY_SUBDIV:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
